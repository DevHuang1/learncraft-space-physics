<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Physics Lab</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#070b16;color:#f7f3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 42%,#192752 0%,#0b1020 34%,#070b16 73%)}#lab{height:100vh;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.hud{position:absolute;inset:0;pointer-events:none;padding:22px;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.eyebrow{color:#a6aec8;letter-spacing:.16em;font-size:10px;font-weight:800}h1{margin:4px 0 0;font-size:22px;letter-spacing:-.03em}.readout{text-align:right;color:#a6aec8;font-size:12px;line-height:1.6}.readout strong{color:#fff}.controls{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;max-width:700px}button{appearance:none;border:1px solid #34456f;background:rgba(20,29,53,.92);color:#e8e4ff;padding:9px 11px;border-radius:999px;font:700 12px/1 inherit;cursor:pointer;transition:.15s ease}button:hover{transform:translateY(-1px);border-color:#8b5cf6}button.active{background:#8b5cf6;border-color:#c4b5fd;color:#fff}.hint{color:#a6aec8;font-size:12px;max-width:340px;text-align:right;line-height:1.5}.panel{pointer-events:auto;position:absolute;right:22px;top:86px;width:250px;padding:15px;border:1px solid #34456f;border-radius:18px;background:rgba(10,16,34,.92);box-shadow:0 16px 48px rgba(0,0,0,.35);backdrop-filter:blur(14px)}.panel[hidden]{display:none}.panel h2{font-size:13px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin:11px 0;color:#a6aec8;font-size:12px}.row output{color:#fff;font-variant-numeric:tabular-nums}.row input{grid-column:1/-1;width:100%;accent-color:#8b5cf6}.sound{display:flex;gap:8px;align-items:center;color:#a6aec8;font-size:12px}.legend{display:flex;gap:12px;color:#a6aec8;font-size:11px}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot);margin:0 6px 1px 0}@media(max-width:640px){.hud{padding:16px}.top{flex-direction:column}.readout{text-align:left}.bottom{align-items:flex-end}.hint{display:none}.panel{right:16px;top:100px;width:230px}}
</style></head>
<body><main id="lab"><canvas id="space" aria-label="Interactive orbital physics simulation"></canvas><section class="hud" aria-live="polite"><div class="top"><div><div class="eyebrow">ORBITAL PHYSICS / CANVAS PROTOTYPE</div><h1>Gravity Well Field</h1></div><div class="readout"><div><strong id="fps">0</strong> FPS · <strong id="count">120</strong> elements</div><div><strong id="wells">0</strong> wells · <strong id="collisions">0</strong> bounces · <strong id="quality">High</strong> quality</div></div></div><div class="bottom"><div class="controls"><button id="place" type="button">Drop gravity well</button><button data-count="120" class="active" type="button">120 elements</button><button data-count="250" type="button">250 elements</button><button data-count="500" type="button">500 elements</button><button id="pause" type="button">Pause</button><button id="sound" type="button">Enable spatial audio</button><button id="settings" type="button">Physics settings</button><button id="reset" type="button">Reset field</button></div><div class="hint">Drop a well, drag a bright object, or enable spatial audio to hear close passes and gravity capture.</div></div></section><aside class="panel" id="panel" hidden><h2>Object physics</h2><div class="row"><span>Mass</span><output id="massOut">1.00</output><input id="mass" type="range" min="0.3" max="2.5" step="0.05" value="1"></div><div class="row"><span>Elasticity</span><output id="elasticityOut">0.82</output><input id="elasticity" type="range" min="0.1" max="1" step="0.01" value=".82"></div><label class="sound"><input id="audioToggle" type="checkbox"> sound feedback enabled</label></aside></main>
<script>
const canvas=document.querySelector('#space'),ctx=canvas.getContext('2d'),fpsEl=document.querySelector('#fps'),countEl=document.querySelector('#count'),wellsEl=document.querySelector('#wells'),collisionEl=document.querySelector('#collisions'),qualityEl=document.querySelector('#quality');
const place=document.querySelector('#place'),pauseBtn=document.querySelector('#pause'),soundBtn=document.querySelector('#sound'),settingsBtn=document.querySelector('#settings'),panel=document.querySelector('#panel'),resetBtn=document.querySelector('#reset'),massInput=document.querySelector('#mass'),elasticityInput=document.querySelector('#elasticity'),massOut=document.querySelector('#massOut'),elasticityOut=document.querySelector('#elasticityOut'),audioToggle=document.querySelector('#audioToggle');
const countButtons=[...document.querySelectorAll('[data-count]')],palette=['#a78bfa','#34d399','#60a5fa','#fbbf24','#f472b6'];let width=0,height=0,dpr=1,paused=false,placing=false,audioEnabled=false,targetCount=120,bodies=[],wells=[],particles=[],selected=null,dragging=null,collisionCount=0,last=performance.now(),accumulator=0,fpsFrames=0,fpsAt=last,quality='high',audioCtx=null,master=null;const fixedStep=1/30;
const seed=i=>{const x=Math.sin(i*91.173)*43758.5453;return x-Math.floor(x)};
function resize(){dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function createBodies(count){bodies=Array.from({length:count},(_,i)=>{const a=seed(i)*Math.PI*2,r=80+seed(i+33)*Math.min(width,height)*.42;return{x:width/2+Math.cos(a)*r,y:height/2+Math.sin(a)*r,vx:(seed(i+11)-.5)*1.4,vy:(seed(i+21)-.5)*1.4,mass:massValue()*(.65+seed(i+8)*.7),r:2+seed(i+15)*2.8,color:palette[i%palette.length],lastHit:-999,lastWellCue:0}});countEl.textContent=count}
function massValue(){return Number(massInput.value)}
function elasticity(){return Number(elasticityInput.value)}
function addBurst(x,y,color){for(let i=0;i<16;i++){const a=i/16*Math.PI*2;particles.push({x,y,vx:Math.cos(a)*(1.5+seed(i+Date.now())*2.8),vy:Math.sin(a)*(1.5+seed(i+9+Date.now())*2.8),life:1,color})}if(particles.length>180)particles.splice(0,particles.length-180)}
function addWell(x,y){if(wells.length>=4)wells.shift();wells.push({x,y,mass:.56,radius:220,expires:performance.now()+20000});addBurst(x,y,'#fbbf24');wellsEl.textContent=wells.length;playTone('well',x,y,1)}
function audioStart(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.07;master.connect(audioCtx.destination)}
function playTone(kind,x,y,strength){if(!audioEnabled)return;audioStart();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),pan=audioCtx.createStereoPanner();const panValue=Math.max(-1,Math.min(1,(x-width/2)/(width/2)));pan.pan.value=panValue;osc.type=kind==='well'?'sine':'triangle';osc.frequency.value=kind==='well'?130+strength*55:240+strength*160;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(Math.min(.08,.02+strength*.015),audioCtx.currentTime+.008);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(kind==='well'?.22:.08));osc.connect(gain).connect(pan).connect(master);osc.start();osc.stop(audioCtx.currentTime+(kind==='well'?.24:.1))}
function forceTo(b,x,y,mass,radius,scale){const dx=x-b.x,dy=y-b.y;if(Math.abs(dx)>radius||Math.abs(dy)>radius)return;const dist=Math.hypot(dx,dy)||1;if(dist>radius)return;const fall=1-dist/radius,f=Math.min(quality==='low'?4:10,mass*fall*fall*scale/(dist/80+1));b.vx+=dx/dist*f;b.vy+=dy/dist*f;return{dist,fall}}
function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,minDist=a.r+b.r+1;if(dist>=minDist)return false;const nx=dx/dist,ny=dy/dist,overlap=minDist-dist;a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rel=rvx*nx+rvy*ny;if(rel>0)return false;const e=elasticity(),impulse=-(1+e)*rel/(1/a.mass+1/b.mass);a.vx-=impulse*nx/a.mass;a.vy-=impulse*ny/a.mass;b.vx+=impulse*nx/b.mass;b.vy+=impulse*ny/b.mass;collisionCount++;if(audioEnabled&&performance.now()-Math.max(a.lastHit,b.lastHit)>90){playTone('collision',(a.x+b.x)/2,(a.y+b.y)/2,Math.min(3,Math.abs(rel)));a.lastHit=b.lastHit=performance.now()}addBurst((a.x+b.x)/2,(a.y+b.y)/2,a.color);return true}
function tick(dt){const now=performance.now(),coreX=width/2,coreY=height/2;wells=wells.filter(w=>w.expires>now);wellsEl.textContent=wells.length;const simCount=quality==='low'?Math.min(bodies.length,150):bodies.length;for(let i=0;i<simCount;i++){const b=bodies[i];if(b===dragging)continue;forceTo(b,coreX,coreY,1.25,Math.max(width,height),.34);for(const w of wells){const hit=forceTo(b,w.x,w.y,w.mass,w.radius,8);if(hit&&hit.dist<w.radius*.28&&now-b.lastWellCue>700){playTone('well',b.x,b.y,hit.fall*2);b.lastWellCue=now}}b.vx=Math.max(-5,Math.min(5,b.vx*.93));b.vy=Math.max(-5,Math.min(5,b.vy*.93));b.x+=b.vx*(dt*30);b.y+=b.vy*(dt*30);if(b.x<0||b.x>width){b.vx*=-elasticity();b.x=Math.max(0,Math.min(width,b.x))}if(b.y<0||b.y>height){b.vy*=-elasticity();b.y=Math.max(0,Math.min(height,b.y))}}
for(let i=0;i<simCount;i++)for(let j=i+1;j<simCount;j++)if(Math.hypot(bodies[j].x-bodies[i].x,bodies[j].y-bodies[i].y)<bodies[i].r+bodies[j].r+1)collide(bodies[i],bodies[j]);collisionEl.textContent=collisionCount;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life-=.028}particles=particles.filter(p=>p.life>0)}
function draw(){ctx.clearRect(0,0,width,height);const g=ctx.createRadialGradient(width/2,height/2,20,width/2,height/2,Math.max(width,height)*.62);g.addColorStop(0,'#172456');g.addColorStop(.38,'#0b1020');g.addColorStop(1,'#070b16');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);for(let i=0;i<90;i++){ctx.fillStyle='rgba(255,255,255,'+(.16+seed(i)*.45)+')';ctx.fillRect(seed(i+300)*width,seed(i+400)*height,1.5,1.5)}for(const w of wells){const alpha=Math.max(0,(w.expires-performance.now())/20000);ctx.beginPath();ctx.arc(w.x,w.y,w.radius,0,Math.PI*2);ctx.strokeStyle='rgba(251,191,36,'+(alpha*.18)+')';ctx.stroke();ctx.beginPath();ctx.arc(w.x,w.y,14+Math.sin(performance.now()/250)*3,0,Math.PI*2);ctx.fillStyle='rgba(251,191,36,'+(alpha*.9)+')';ctx.fill();ctx.fillStyle='#fde68a';ctx.font='700 10px system-ui';ctx.fillText('WELL',w.x+18,w.y+3)}ctx.beginPath();ctx.arc(width/2,height/2,65,0,Math.PI*2);ctx.fillStyle='#8b5cf6';ctx.shadowColor='#8b5cf6';ctx.shadowBlur=34;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillText('CORE',width/2,height/2+4);for(let i=0;i<bodies.length;i++){const b=bodies[i];if(quality==='low'&&i>=150)continue;ctx.beginPath();ctx.arc(b.x,b.y,b.r+(b===selected?2:0),0,Math.PI*2);ctx.fillStyle=b.color;ctx.globalAlpha=b===selected?1:.72;ctx.fill()}ctx.globalAlpha=1;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function frame(now){const elapsed=Math.min(.08,(now-last)/1000);last=now;if(!paused){accumulator=Math.min(accumulator+elapsed,fixedStep*3);let loops=0;while(accumulator>=fixedStep&&loops<3){tick(fixedStep);accumulator-=fixedStep;loops++}}draw();fpsFrames++;if(now-fpsAt>750){const f=Math.round(fpsFrames*1000/(now-fpsAt));fpsEl.textContent=f;fpsFrames=0;fpsAt=now;quality=f<32?'low':f<48?'balanced':'high';qualityEl.textContent=quality[0].toUpperCase()+quality.slice(1)}requestAnimationFrame(frame)}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{const p=point(e);if(placing){addWell(p.x,p.y);placing=false;place.classList.remove('active');return}let near=null,dist=Infinity;for(const b of bodies.slice(0,Math.min(24,bodies.length))){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<dist){dist=d;near=b}}if(near&&dist<34){dragging=near;selected=near;canvas.setPointerCapture(e.pointerId);addBurst(near.x,near.y,near.color)}else{selected=null;addBurst(p.x,p.y,'#a78bfa')}});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=point(e);dragging.x=p.x;dragging.y=p.y;dragging.vx=dragging.vy=0});canvas.addEventListener('pointerup',e=>{if(dragging){dragging.vx=(seed(Date.now())-.5)*1.5;dragging.vy=(seed(Date.now()+1)-.5)*1.5;dragging=null}canvas.releasePointerCapture?.(e.pointerId)});
place.onclick=()=>{placing=!placing;place.classList.toggle('active',placing)};pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'};settingsBtn.onclick=()=>{panel.hidden=!panel.hidden};resetBtn.onclick=()=>{wells=[];particles=[];collisionCount=0;createBodies(targetCount)};soundBtn.onclick=()=>{audioEnabled=!audioEnabled;audioToggle.checked=audioEnabled;soundBtn.textContent=audioEnabled?'Spatial audio on':'Enable spatial audio';soundBtn.classList.toggle('active',audioEnabled);if(audioEnabled)audioStart()};audioToggle.onchange=()=>{audioEnabled=audioToggle.checked;soundBtn.textContent=audioEnabled?'Spatial audio on':'Enable spatial audio';soundBtn.classList.toggle('active',audioEnabled);if(audioEnabled)audioStart()};massInput.oninput=()=>{massOut.textContent=Number(massInput.value).toFixed(2);bodies.forEach(b=>b.mass=Number(massInput.value))};elasticityInput.oninput=()=>elasticityOut.textContent=Number(elasticityInput.value).toFixed(2);countButtons.forEach(b=>b.onclick=()=>{targetCount=Number(b.dataset.count);countButtons.forEach(x=>x.classList.toggle('active',x===b));createBodies(targetCount)});window.addEventListener('resize',()=>{resize();createBodies(targetCount)});resize();createBodies(targetCount);requestAnimationFrame(frame);
</script></body></html>
