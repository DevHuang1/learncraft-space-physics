name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Samsung APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learncraft-space-physics-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0-build-${{ github.run_number }}
          name: LearnCraft Space Physics Android build ${{ github.run_number }}
          body: |
            Debug APK for personal Samsung-device testing.

            This build is unsigned and is not intended for Play Store distribution.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      - name: Publish run summary
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "## Samsung APK" >> "$GITHUB_STEP_SUMMARY"
          echo "The debug APK was built successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Path: \\`$APK\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \\`learncraft-space-physics-debug-apk\\` artifact from this workflow run." >> "$GITHUB_STEP_SUMMARY"
