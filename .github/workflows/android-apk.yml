name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

env:
  APP_VERSION: "1.0.1"

jobs:
  build-apk:
    name: Build signed Samsung APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learncraft-space-physics-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public signed GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: LearnCraft Space Physics signed Android build ${{ env.APP_VERSION }}
          body: |
            Signed release APK for Samsung and other Android devices.

            Build version: ${{ env.APP_VERSION }}
            Version code: 2
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Publish run summary
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          echo "## Signed Samsung APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build version: $APP_VERSION (version code 2)" >> "$GITHUB_STEP_SUMMARY"
          echo "Path: \\`$APK\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \\`learncraft-space-physics-release-apk\\` artifact from this workflow run." >> "$GITHUB_STEP_SUMMARY"
